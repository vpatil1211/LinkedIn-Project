apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: notifications-db
spec:
  selector:
    matchLabels:
      app: notifications-db
  serviceName: notifications-db
  replicas: 1
  template:
    metadata:
      labels:
        app: notifications-db
    spec:
      containers:
        - name: notifications-db
          image: postgres:16
          resources:
            limits:
              memory: "200Mi"
              cpu: "200m"
            requests:
              memory: "100Mi"
              cpu: "100m"
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: root
            - name: POSTGRES_DB
              value: notificationsDB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
          - containerPort: 5432
          volumeMounts:
          - name: data
            mountPath: /var/lib/postgresql/data/pgdata
  volumeClaimTemplates:
    - metadata:
        name: data  
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
        storageClassName: "standard"  
        volumeMode: Filesystem 
---

  apiVersion: v1
  kind: Service
  metadata:
    name: notifications-db
  spec:
    selector:
      app: notifications-db
    ports:
    - port: 5432
      targetPort: 5432
  

