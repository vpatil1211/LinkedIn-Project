spring.application.name=posts-service

server.servlet.context-path=/posts
server.port=9010

spring.datasource.url=jdbc:postgresql://localhost:5432/postsDB
spring.datasource.username=postgres
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update

!-- Discovery service (default url for eureka server to register the service) --!
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Register IP address instead of LAPTOP-7972CIF1.mshome.net
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1